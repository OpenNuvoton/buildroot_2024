# weston.ini for ivi-shell mode
#
# Shell detection in QPA transport is automatic:
#   ivi-shell  → ivi_application_surface_create (IVI surface ID from QT_IVI_SURFACE_ID)
#   kiosk-shell → xdg_toplevel + xdg_surface (existing path)

[core]
backend=drm-backend.so
shell=ivi-shell.so
modules=nu-hmi-controller.so
idle-time=0

[libinput]
touchscreen_calibrator=true
calibration_helper=/etc/xdg/save-resistive-touch-calibration.sh

# ── Layer definitions for nu-hmi-controller.so ────────────────────────────────
# Each [nuvoton-layer] section defines one IVI layer.
# id          = IVI surface ID that maps to this layer
#               (must match what the client passes to ivi_application_surface_create)
# render-order= z-order on screen (lower = further back)
#
# Default layout:
#   Layer 1000 — video  (bottom, plane[31] primary,  zpos=0)
#   Layer 2000 — Qt UI  (top,    plane[38] overlay,  zpos=1)
#
# To put video on top and Qt on bottom, swap render-order:
#   layer 1000 render-order=1  (video on top  → plane[38] overlay zpos=1)
#   layer 2000 render-order=0  (Qt on bottom  → plane[31] primary zpos=0)
#
# To add a third client: add another [nuvoton-layer] section.

[nuvoton-layer]
id=1000
render-order=0

[nuvoton-layer]
id=2000
render-order=1
